[project]
name = "programas-fibra-data-processing"
version = "0.1.0"
description = "Process GeoJSON files from the fiber programs to only include awarded areas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geojson>=3.2.0",
    "geopandas>=1.1.1",
    "h3>=4.3.1",
    "ijson>=3.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "shapely>=2.1.1",
    "simplejson>=3.20.1",
    "xlsxwriter>=3.2.3",
]

[dependency-groups]
dev = ["black>=25.1.0", "pytest>=8.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
